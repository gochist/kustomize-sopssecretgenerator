version: 2

project_name: kustomize-sopssecretgenerator

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org

env_files:
  github_token: .github_token

before:
  hooks:
    - go mod tidy

builds:
  - binary: SopsSecretGenerator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64

archives:
  - formats: [binary]

changelog:
  filters:
    exclude:
      - '^Release version'
      - '^Merge pull request'

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: gochist
    name: kustomize-sopssecretgenerator
  name_template: "Version {{.Version}}"
  prerelease: auto
  make_latest: false
